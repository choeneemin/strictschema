[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choeneemin-strictschema"
version = "0.1.0"
description = "在同一个输入里两两比对，检测JSON schema 的严格模式相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "choeneemin" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://choeneemin.github.io"
Repository = "https://github.com/choeneemin/strictschema"
Issues = "https://github.com/choeneemin/strictschema/issues"

[project.scripts]
strictschema = "strictschema:main"

[tool.setuptools]
py-modules = ["strictschema"]
